<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crystal Depths</title>
<style>
  html, body { height: 100%; }
  body { background: #0b0b0e; color: #ccc; font: 16px/1.15 Consolas, "Courier New", monospace; margin: 0;
         padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; }
  pre { margin: 0; }
  /* Fixed two-line height: a message that wraps must not resize (and so jump) the map below. */
  #banner { font-size: 20px; line-height: 1.15; height: 2.3em; overflow: hidden; flex-shrink: 0; }
  #wrap { flex: 1; min-height: 0; display: flex; gap: 16px; }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #view { flex: 1; min-height: 0; overflow: hidden; background: #000; border: 1px solid #333;
          display: flex; align-items: center; justify-content: center; }
  #log { height: 9.2em; overflow: hidden; }
  #side { width: 340px; white-space: pre-wrap; overflow: auto; }
  .dim { opacity: .35; }
  /* Map mode: IBM BIOS 8x8 font (square cells, full code page 437 incl. box-drawing and shade blocks;
     fonts/LICENSE-oldschool-pc-fonts.txt). Each tile is a 1em square, so box/block glyphs join their neighbours. */
  @font-face { font-family: "IBM BIOS"; src: url("fonts/WebPlus_IBM_BIOS.woff") format("woff"); }
  #view:has(#map.square) { align-items: flex-start; justify-content: flex-start; } /* renderMap sets whole-pixel margins */
  #map.square { font-family: "IBM BIOS", Consolas, monospace; line-height: 1em; }
  #map.square span { display: inline-block; vertical-align: top; width: 1em; height: 1em; line-height: 1em; text-align: center; }
  /* Box-drawing glyphs: Windows text rendering blurs glyph edges horizontally (even grayscale AA), so a glyph's edge
     column is slightly faint and a dark seam shows where roots join. Stretch them 1/16 wider so the faint fringe falls
     outside the tile, and clip it there - edges are solid and neighbours never overlap. */
  #map.square span.join { overflow: hidden; }
  /* Phase Shift: the phased entity shimmers in and out of reality (animations override the inline colour). */
  :is(#map.square, #actors) span.phased { animation: phase 0.8s ease-in-out infinite alternate; }
  @keyframes phase { from { opacity: 1; color: #fff; } to { opacity: 0.3; color: #f6f; } }
  /* Stunned: shakes and flickers yellow. Frozen: icy white glyph in a pulsing frost glow. */
  :is(#map.square, #actors) span.stunned { animation: stun 0.25s steps(2) infinite; }
  @keyframes stun { from { transform: translateX(-1px); color: #ff4; } to { transform: translateX(1px); color: #fff; } }
  :is(#map.square, #actors) span.frozen { animation: frost 1.2s ease-in-out infinite alternate; color: #eaffff !important; }
  @keyframes frost { from { box-shadow: inset 0 0 0.15em #8ef; } to { box-shadow: inset 0 0 0.45em #dff; } }
  /* Burning: flickers through fire colours with a warm glow. Poisoned: sickly green pulse and a queasy bob. */
  :is(#map.square, #actors) span.burning { animation: burn 0.3s steps(3) infinite; }
  @keyframes burn { 0% { color: #ffd060; box-shadow: inset 0 -0.2em 0.3em #f60; } 50% { color: #f80; box-shadow: inset 0 -0.35em 0.4em #f30; }
                    100% { color: #f42; box-shadow: inset 0 -0.15em 0.25em #fa0; } }
  :is(#map.square, #actors) span.poisoned { animation: poison 1s ease-in-out infinite alternate; }
  @keyframes poison { from { color: #6f6; transform: translateY(0); box-shadow: inset 0 0 0.2em #3a3; }
                      to { color: #cfc; transform: translateY(1px); box-shadow: inset 0 0 0.45em #7f2; } }
  /* Silenced: struck through and fading between grey and lavender - muted. */
  :is(#map.square, #actors) span.silenced { text-decoration: line-through 2px #c8c8ff; animation: silence 1.4s ease-in-out infinite alternate; }
  @keyframes silence { from { color: #aab; } to { color: #556; } }
  /* Afraid: cowers (shrunk), trembles and blanches between pale violet and white. */
  :is(#map.square, #actors) span.afraid { animation: fear 0.18s steps(2) infinite; }
  @keyframes fear { from { transform: scale(0.82) translate(-1px, 1px); color: #d9f; } to { transform: scale(0.82) translate(1px, 0); color: #fff; } }
  /* Mana shield soaking a hit (Entity.flashCss): a bright blue ring bursts out and fades, once. */
  /* Bursting up out of the ground (a bone worm resurfacing): rises from a sliver, overshoots, settles. rdN = stagger. */
  :is(#map.square, #actors) span.rise { animation: rise 0.4s ease-out both; }
  @keyframes rise { 0% { transform: translateY(0.3em) scale(0.15, 0.1); opacity: 0; } 70% { transform: translateY(-0.1em) scale(1.2); opacity: 1; } 100% { transform: none; } }
  :is(#map.square, #actors) span.rd1 { animation-delay: 0.1s; } :is(#map.square, #actors) span.rd2 { animation-delay: 0.2s; }
  :is(#map.square, #actors) span.rd3 { animation-delay: 0.3s; } :is(#map.square, #actors) span.rd4 { animation-delay: 0.4s; }
  :is(#map.square, #actors) span.rd5 { animation-delay: 0.5s; } :is(#map.square, #actors) span.rd6 { animation-delay: 0.6s; }
  /* Soul runes round the Lich (tile css 'ebb'): a slow violet breathing. The phylactery: a throbbing soul-light. */
  #map.square span.ebb { animation: ebb 2.4s ease-in-out infinite alternate; }
  @keyframes ebb { from { color: #6a4a9a; } to { color: #e8c8ff; text-shadow: 0 0 0.3em #b48cff; } }
  :is(#map.square, #actors) span.phylactery { animation: phylactery 1.1s ease-in-out infinite alternate; }
  @keyframes phylactery { from { color: #8a5ac0; box-shadow: inset 0 0 0.1em #6a3aa0; } to { color: #f4dcff; box-shadow: inset 0 0 0.5em #b48cff, 0 0 0.4em #8a5ac0; } }
  /* The Lich: a sickly green-white corpse-light flaring round it, so it stands out in its violet sanctum. */
  :is(#map.square, #actors) span.lich { animation: lich 1.4s ease-in-out infinite alternate; font-weight: bold; }
  @keyframes lich { from { color: #9fe890; text-shadow: 0 0 0.15em #3a8a2a; box-shadow: inset 0 0 0.2em #1a4a12; }
                    to { color: #f4fff0; text-shadow: 0 0 0.4em #8fff70, 0 0 0.8em #4fcf30; box-shadow: inset 0 0 0.5em #2f7a20; } }
  /* Hatching spiderlings (css hatch): pop out small and grow. A bursting egg sac (float css burst): swells and fades. */
  :is(#map.square, #actors) span.hatch { animation: hatch 0.35s ease-out both; }
  @keyframes hatch { 0% { transform: scale(0.2); opacity: 0.3; } 70% { transform: scale(1.2); opacity: 1; } 100% { transform: none; } }
  #floats span.burst { font-family: "IBM BIOS", Consolas, monospace; font-weight: normal; text-shadow: 0 0 0.3em #f4ff90; height: 1em;
                       animation: burst 0.45s ease-out both; }
  @keyframes burst { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.2); opacity: 0; } }
  /* Gear on the hero (heroGearLook): small glyphs (b.gm) laid over the hero's tile, each moved and shrunk into place by
     its own transform - helm, cuirass plates, shield, weapon. A full set: a faint glow round the tile, under the glyph. */
  :is(#map.square, #actors) span.geared { position: relative; }
  :is(#map.square, #actors) span.geared b.gm { position: absolute; left: 0; top: 0; width: 1em; height: 1em; line-height: 1em;
    text-align: center; font-weight: normal; pointer-events: none; }
  /* the weapon and shield (b.gm.ol) get a crisp dark outline (no blur, 1 font pixel each way) so they stand apart */
  :is(#map.square, #actors) span.geared b.gm.ol {
    text-shadow: 0.125em 0 #000, -0.125em 0 #000, 0 0.125em #000, 0 -0.125em #000,
      0.125em 0.125em #000, -0.125em 0.125em #000, 0.125em -0.125em #000, -0.125em -0.125em #000; }
  :is(#map.square, #actors) span.set-bone { --setc: #e8dcb0; animation: setglow 2.4s ease-in-out infinite alternate; }
  :is(#map.square, #actors) span.set-silk { --setc: #c8b8ff; animation: setglow 3s ease-in-out infinite alternate; }
  @keyframes setglow { from { box-shadow: inset 0 0 0.02em transparent; } to { box-shadow: inset 0 0 0.14em var(--setc); } }
  :is(#map.square, #actors) span.shieldhit { animation: shieldhit 0.7s ease-out; }
  @keyframes shieldhit { 0% { color: #fff; box-shadow: inset 0 0 0 0.45em #6cf, 0 0 0.5em #6cf; }
                         100% { box-shadow: inset 0 0 0 1px rgba(102, 204, 255, 0), 0 0 0 rgba(102, 204, 255, 0); } }
  /* Monster looks (monster `css` field). Bone forge: a throbbing ember heart. */
  :is(#map.square, #actors) span.forge { animation: forge 0.9s ease-in-out infinite; }
  @keyframes forge { 0%, 100% { color: #ff6a3a; transform: scale(1); box-shadow: inset 0 0 0.15em #a02000; }
                     50% { color: #ffd080; transform: scale(1.15); box-shadow: inset 0 0 0.5em #ff4000; } }
  /* Bone Colossus body: the bones shift and grind (bright, no background, its colour shimmering - stands out from bone walls). */
  :is(#map.square, #actors) span.writhe { animation: writhe 0.8s ease-in-out infinite alternate; }
  @keyframes writhe { from { color: #fff4d8; } to { color: #c8b890; } }
  /* Taunted: swells up angry, flushing red. */
  :is(#map.square, #actors) span.taunted { animation: taunt 0.5s ease-in-out infinite alternate; }
  @keyframes taunt { from { transform: scale(1); color: #f66; box-shadow: inset 0 0 0 1px #a22; } to { transform: scale(1.15); color: #fcc; box-shadow: inset 0 0 0.4em #f33; } }
  /* Hidden: faint breathing ghost. Webbed: silk strands over the tile + struggling wiggle. Cursed: throbbing dark aura.
     Shielded: pulsing blue ring. Coiled: dashed tether ring tightening. Afflicted: magenta flicker with inner glow. */
  :is(#map.square, #actors) span.hidden { animation: hide 2s ease-in-out infinite alternate; }
  @keyframes hide { from { opacity: 0.25; color: #888; } to { opacity: 0.5; color: #bbb; } }
  :is(#map.square, #actors) span.webbed { background-image: repeating-linear-gradient(45deg, #ddd6 0 1px, transparent 1px 5px),
                            repeating-linear-gradient(-45deg, #ddd6 0 1px, transparent 1px 5px) !important;
                            animation: webbed 0.5s ease-in-out infinite alternate; }
  @keyframes webbed { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  /* Stuck (quicksand, snare): bobs down and back up, as if sinking. */
  :is(#map.square, #actors) span.stuck { animation: stuck 0.7s ease-in-out infinite alternate; }
  @keyframes stuck { from { transform: translateY(0); } to { transform: translateY(0.12em); } }
  :is(#map.square, #actors) span.cursed { animation: curse 1.1s ease-in-out infinite alternate; }
  @keyframes curse { from { color: #c6f; box-shadow: inset 0 0 0.15em #306; } to { color: #739; box-shadow: inset 0 0 0.5em #90f; } }
  /* Unstoppable: a hot bronze frame that throbs - braced and immovable. */
  :is(#map.square, #actors) span.unstoppable { animation: unstoppable 0.6s ease-in-out infinite alternate; }
  @keyframes unstoppable { from { box-shadow: inset 0 0 0 2px #a8642a; color: #fc8; } to { box-shadow: inset 0 0 0 3px #ffb060, 0 0 0.3em #f93; color: #fff; } }
  /* Warded: a slow-turning arcane rune ring (dotted, violet-blue). */
  :is(#map.square, #actors) span.warded { outline: 2px dotted #9cf; animation: ward 1.2s ease-in-out infinite alternate; }
  @keyframes ward { from { outline-offset: -2px; outline-color: #69c; } to { outline-offset: -4px; outline-color: #c9f; } }
  :is(#map.square, #actors) span.shielded { animation: shield 1s ease-in-out infinite alternate; }
  @keyframes shield { from { box-shadow: inset 0 0 0 1px #48c; } to { box-shadow: inset 0 0 0 3px #8cf, 0 0 0.3em #6af; } }
  :is(#map.square, #actors) span.coiled { outline: 2px dashed #88f; animation: coil 0.7s ease-in-out infinite alternate; }
  @keyframes coil { from { outline-offset: -1px; } to { outline-offset: -5px; } }
  :is(#map.square, #actors) span.afflicted { animation: afflict 0.45s steps(3) infinite; }
  @keyframes afflict { 0% { color: #f4a; box-shadow: inset 0 0 0.2em #a14; } 50% { color: #fff; box-shadow: inset 0 0 0.45em #f4a; }
                       100% { color: #a14; box-shadow: inset 0 0 0.1em #612; } }
  /* Smooth movement (option O): #stage (map + creatures) slides when the camera moves; creatures sit on #actors and
     slide between tiles. Each creature is an outer span (positioned by transform) holding the glyph span (status class). */
  #stage { position: relative; }
  #actors { position: absolute; left: 0; top: 0; font-family: "IBM BIOS", Consolas, monospace; line-height: 1em; pointer-events: none; }
  #actors > span { position: absolute; left: 0; top: 0; width: 1em; height: 1em; }
  #actors > span > span { display: block; width: 1em; height: 1em; line-height: 1em; text-align: center; }
  /* Swelling gas vent (tile css 'swell'): the bubble pulses bigger and brighter - it's about to burst. */
  #map.square span.swell { animation: swell .45s ease-in-out infinite alternate; }
  @keyframes swell { from { transform: scale(.85); box-shadow: inset 0 0 .15em #5a2; } to { transform: scale(1.2); color: #f4ff90; box-shadow: inset 0 0 .5em #bf4; } }
  /* Gas puffs (fx.puff, e.g. swamp gas): the original tile tint, but growing - the centre tile first, then the ring
     around it fades in, holds and everything fades out. Translucent, so the tiles stay readable. --c = 'r,g,b'. */
  #puffs { position: absolute; left: 0; top: 0; pointer-events: none; }
  /* Floating numbers (fx.float): damage (-7) and heals (+5) rise from a creature's tile and fade. */
  #floats { position: absolute; left: 0; top: 0; pointer-events: none; }
  #floats span { position: absolute; text-align: center; font-weight: bold; font-family: Consolas, monospace; line-height: 1;
                 text-shadow: 0 0 2px #000, 0 0 2px #000; animation: floatUp 0.9s ease-out both; }
  /* A glyph sinking into the ground (fx.float css 'sink'): the bone worm burrowing, head first, its body following. */
  #floats span.sink { font-family: "IBM BIOS", Consolas, monospace; font-weight: normal; text-shadow: none; height: 1em;
                      animation: sink 0.45s ease-in both; }
  @keyframes sink { 0% { transform: none; opacity: 1; } 60% { opacity: 0.8; } 100% { transform: translateY(0.3em) scale(0.15, 0.1); opacity: 0; } }
  @keyframes floatUp { 0% { transform: translateY(0.2em); opacity: 1; } 70% { opacity: 1; } 100% { transform: translateY(-1.6em); opacity: 0; } }
  /* Health bar: a thin bar along the bottom of a hurt creature's tile (--hp = fraction left, --hpc = its colour). */
  :is(#map.square, #actors) span.hurt { position: relative; }
  :is(#map.square, #actors) span.hurt::after { content: ''; position: absolute; left: 0.06em; bottom: 0; height: 0.1em;
                 width: calc(var(--hp) * 0.88em); background: var(--hpc); box-shadow: 0 0 0 1px #000; }
  #puffs div { position: absolute; }
  #puffs span { position: absolute; width: 1em; height: 1em; opacity: 0; background: rgba(var(--c), .5); animation: gasCore 1s linear forwards; }
  #puffs span.ring { animation-name: gasRing; }
  @keyframes gasCore { 0% { opacity: 0; } 12% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes gasRing { 0%, 15% { opacity: 0; } 45% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
  #map.square span.join i { display: inline-block; font-style: normal; transform: scaleX(1.0625); }
</style>
</head>
<body>
<div id="banner"></div>
<div id="wrap">
  <div id="main">
    <div id="view"><div id="stage"><pre id="map"></pre><div id="puffs"></div><div id="actors"></div><div id="floats"></div></div></div>
    <div id="log"></div>
  </div>
  <pre id="side"></pre>
</div>
<script src="js/utils.js"></script>
<script src="js/map.js"></script>
<script src="js/generators.js"></script>
<script src="js/status.js"></script>
<script src="js/fx.js"></script>
<script src="js/entities.js"></script>
<script src="js/ai.js"></script>
<script src="js/skills.js"></script>
<script src="js/items.js"></script>
<script src="js/features.js"></script>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/inventory.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
